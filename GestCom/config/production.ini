###
# GestCom — Configuration PRODUCTION
# Fichier : config/production.ini
#
# Différences avec development.ini :
#   - plus AUCUN mot de passe / identifiant en clair : tout vient de
#     l'environnement du serveur (fichier .env non versionné, ou variables
#     systemd). Voir .env.example pour la liste des variables attendues.
#   - pyramid_debugtoolbar RETIRÉ (fuite d'informations + lenteur).
#   - reload_templates = false (les templates ne changent pas en prod).
#   - l'application n'écoute QUE sur 127.0.0.1 : c'est nginx (reverse proxy)
#     qui reçoit le trafic public en HTTPS et le transmet ici.
#   - le filtre "proxy-prefix" lit les en-têtes X-Forwarded-* envoyés par
#     nginx, pour que Pyramid génère des URL en https:// (QR codes, redirections).
#
# Lancement (sur le serveur) :
#   pserve GestCom/config/production.ini
###

# ── L'application ────────────────────────────────────────────
[app:GestCom]
use = egg:GestCom

pyramid.reload_templates = false
# Les fichiers .jinja2 ne sont pas surveillés : gain de performance.
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = fr

pyramid.includes =
# VIDE : pas de pyramid_debugtoolbar en production.
# (En dev, cette liste contenait pyramid_debugtoolbar.)

# ── Connexion MySQL ─────────────────────────────────────────
# Valeur d'EXEMPLE uniquement. La vraie URL — avec le mot de passe du
# serveur — doit être fournie via la variable d'environnement DATABASE_URL
# (voir GestCom/__init__.py qui l'injecte ici au démarrage).
# Si DATABASE_URL est absente, l'application refusera de démarrer : c'est voulu.
sqlalchemy.url = mysql+pymysql://utilisateur:motdepasse@localhost/gestcom_db

# ── Jinja2 ─────────────────────────────────────────────────
jinja2.directories = GestCom:templates
jinja2.extensions = jinja2.ext.i18n

# ── SMTP — Alertes email ───────────────────────────────────
# smtp.user / smtp.password / smtp.dest viennent de .env (SMTP_USER, etc.).
smtp.host = smtp.gmail.com
smtp.port = 587

# ── Fiabilité ──────────────────────────────────────────────
retry.attempts = 3

# ── Accès à l'application (protection niveau A) ─────────────
# acces.utilisateur / acces.motdepasse viennent OBLIGATOIREMENT de
# l'environnement (ACCES_UTILISATEUR / ACCES_MOTDEPASSE). Sans mot de passe,
# securite.py laisse tout passer et l'écrit dans les logs à chaque démarrage.

# ── Reverse proxy (nginx → application) ─────────────────────
# Traduit les en-têtes X-Forwarded-Proto / -Host / -For posés par nginx,
# pour que request.scheme vaille "https" côté Pyramid.
[filter:proxy-prefix]
use = egg:PasteDeploy#prefix
prefix = /

# ── Chaîne de traitement : nginx → proxy-prefix → application ──
[pipeline:main]
pipeline =
    proxy-prefix
    GestCom

# ── Serveur web ────────────────────────────────────────────
[server:main]
use = egg:waitress#main
# N'écoute QUE en local : le monde extérieur passe par nginx (HTTPS) qui
# se connecte ici. Ne jamais mettre 0.0.0.0 sans pare-feu devant.
listen = 127.0.0.1:6543
threads = 4
# Indique à waitress de faire confiance à l'adresse locale de nginx pour
# les en-têtes X-Forwarded-*.
trusted_proxy = 127.0.0.1
trusted_proxy_headers = x-forwarded-for x-forwarded-proto x-forwarded-host
# Masque la version de waitress dans les réponses.
ident =

# ── Journalisation (logs) ──────────────────────────────────
# Tout part sur la sortie standard : sur un serveur Linux avec systemd,
# c'est journald qui collecte (consultation : journalctl -u gestcom).
[loggers]
keys = root, GestCom, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_GestCom]
level = INFO
handlers =
qualname = GestCom

[logger_sqlalchemy]
level = WARN
# WARN : ne journalise pas chaque requête SQL (trop verbeux et lent en prod).
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s] %(message)s
