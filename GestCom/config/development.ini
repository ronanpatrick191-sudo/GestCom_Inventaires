###
# GestCom — Configuration développement
# Fichier : config/development.ini
# Ce fichier règle tout ce dont l'application a besoin pour démarrer en local :
# base de données, emails, serveur web, logs, etc. Il est lu par la commande
# "pserve GestCom/config/development.ini --reload".
###

[app:main]
# Section décrivant l'application elle-même.
use = egg:GestCom
# Dit à Pyramid : "utilise la fonction main() du paquet GestCom pour créer l'app"
# (voir project.entry-points."paste.app_factory" dans pyproject.toml).

pyramid.reload_templates = true
# Recharge automatiquement les templates .jinja2 modifiés, sans redémarrer le serveur.
pyramid.debug_authorization = false
# Désactive les logs détaillés sur les vérifications de droits d'accès (pas utilisé ici).
pyramid.debug_notfound = false
# Désactive les logs détaillés quand une URL ne correspond à aucune route (page 404).
pyramid.debug_routematch = false
# Désactive les logs détaillés sur la façon dont Pyramid choisit la route correspondant à une URL.
pyramid.default_locale_name = fr
# Langue par défaut de l'application : français.
pyramid.includes =
    pyramid_debugtoolbar
    # Active la barre de débogage visible en bas de page en développement.

# ── Connexion MySQL ──────────────────────────────────────────
# IMPORTANT : ceci n'est qu'un EXEMPLE (ce fichier est versionné sur GitHub).
# La vraie URL de connexion — avec le mot de passe — est définie dans .env
# sous le nom DATABASE_URL et écrase cette ligne au démarrage (voir __init__.py).
# Format : mysql+pymysql://utilisateur:motdepasse@hote/nombase
sqlalchemy.url = mysql+pymysql://root:motdepasse_local@localhost/gestcom_db
# Si DATABASE_URL n'est pas défini dans .env, c'est cette valeur d'exemple qui
# est utilisée — et la connexion MySQL échouera tant que .env n'est pas rempli.

# ── Jinja2 ──────────────────────────────────────────────────
jinja2.directories = GestCom:templates
# Indique où se trouvent les fichiers de templates (.jinja2) : dans GestCom/templates/.
jinja2.extensions = jinja2.ext.i18n
# Active l'extension de traduction/internationalisation de Jinja2 (pour du multilingue futur).

# ── SMTP — Alertes email automatiques ───────────────────────
# Pour Gmail : active "Mots de passe des applications" dans ton compte Google
# Les identifiants (smtp.user / smtp.password / smtp.dest) ne sont PLUS ici :
# ils viennent du fichier .env à la racine du projet (voir .env.example).
smtp.host     = smtp.gmail.com
# Adresse du serveur SMTP de Gmail (sert à envoyer les emails d'alerte de stock).
smtp.port     = 587
# Port utilisé pour se connecter au serveur SMTP en mode sécurisé (TLS).

# ── Sécurité ────────────────────────────────────────────────
retry.attempts = 3
# Nombre de fois où Pyramid réessaie automatiquement une requête si elle échoue
# à cause d'une erreur temporaire (ex : conflit de base de données).

[pshell]
# Section pour le "shell Python interactif" de Pyramid (commande pshell).
setup = GestCom.pshell.setup
# Fonction appelée pour préparer l'environnement du shell interactif.

[server:main]
# Section décrivant le serveur web qui fait tourner l'application.
use = egg:waitress#main
# Utilise "waitress" comme serveur web (simple et adapté au développement/production légère).
listen = localhost:6543
# L'application écoute uniquement sur la machine locale, port 6543
# → accessible via http://localhost:6543

[loggers]
# Déclare la liste des "loggers" (enregistreurs de journaux/logs) utilisés plus bas.
keys = root, GestCom, sqlalchemy

[handlers]
# Déclare la liste des "handlers" (où les logs sont envoyés, ex: console) utilisés plus bas.
keys = console

[formatters]
# Déclare la liste des "formatters" (comment les logs sont mis en forme) utilisés plus bas.
keys = generic

[logger_root]
# Configuration du logger principal (racine), qui capte tout ce qui n'est pas plus spécifique.
level = INFO
# Niveau de détail : INFO affiche les messages informatifs, avertissements et erreurs.
handlers = console
# Les logs de ce logger sont envoyés vers la console (terminal).

[logger_GestCom]
# Configuration spécifique aux logs venant du code de l'application GestCom.
level = DEBUG
# Niveau très détaillé, utile en développement pour tout voir.
handlers =
# Aucun handler propre ici : les logs remontent au logger_root (donc vers la console).
qualname = GestCom
# Nom du logger Python correspondant (celui utilisé dans le code avec logging.getLogger("GestCom")).

[logger_sqlalchemy]
# Configuration spécifique aux logs générés par SQLAlchemy (les requêtes SQL).
level = WARN
# Niveau WARN : n'affiche que les avertissements et erreurs (pas toutes les requêtes SQL).
handlers =
# Aucun handler propre : remonte vers logger_root.
qualname = sqlalchemy.engine
# Nom du logger interne de SQLAlchemy correspondant au moteur de base de données.

[handler_console]
# Définit comment le handler "console" fonctionne.
class = StreamHandler
# Utilise la classe StreamHandler du module logging Python (écrit dans un flux, ici stderr).
args = (sys.stderr,)
# Écrit les logs dans la sortie d'erreur standard du terminal (stderr).
level = NOTSET
# Pas de filtre supplémentaire au niveau du handler (laisse passer selon le niveau du logger).
formatter = generic
# Utilise le format de log "generic" défini plus bas.

[formatter_generic]
# Définit le format exact du texte affiché pour chaque ligne de log.
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
# Affiche : date/heure, niveau (INFO/DEBUG...), nom du logger et ligne, nom du thread, message.
